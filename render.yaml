services:
  - type: web
    name: uof-webapp-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.api.bridge:app
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA_PATH
        value: /etc/secrets/ca.pem
      - key: FLASK_SECRET_KEY
        generateValue: true
    # Render has no render.yaml key for uploading a secret file's contents -
    # add it once by hand in the dashboard: Environment -> Secret Files ->
    # filename "ca.pem", mounted at /etc/secrets/ca.pem, contents = the CA
    # cert downloaded from the Aiven Console. See README for details.
